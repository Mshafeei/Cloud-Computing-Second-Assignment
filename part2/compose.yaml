services:
  app:
    build: .
    environment:
      PORT: "8000"
      DATA_DIR: "./data"
    volumes:
      - queue-data:/app/data

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  queue-data: