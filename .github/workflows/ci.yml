name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: part2/Dockerfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Python code with ruff
        run: |
          python -m pip install ruff
          ruff check part2/app/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pytest
        run: |
          cd part2
          python -m pip install -r requirements-dev.txt
          pytest

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./part2
          file: ./part2/Dockerfile
          push: false

  push:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: v1.0.${{ github.run_number }}
        run: |
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$OWNER_LOWER/lab-queue:$VERSION -t ghcr.io/$OWNER_LOWER/lab-queue:latest ./part2
          docker push ghcr.io/$OWNER_LOWER/lab-queue:$VERSION
          docker push ghcr.io/$OWNER_LOWER/lab-queue:latest

  pages:
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Replace __VERSION__ placeholder
        env:
          VERSION: v1.0.${{ github.run_number }}
        run: |
          sed -i "s/__VERSION__/${VERSION}/g" part2/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: part2/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tag:
    needs: [push, pages]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push annotated tag
        env:
          VERSION: v1.0.${{ github.run_number }}
        run: |
          git fetch --tags
          if git tag --points-at HEAD | grep -q .; then
            echo "A tag already exists on this commit. Skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION for commit ${{ github.sha }}"
            git push origin "$VERSION"
          fi